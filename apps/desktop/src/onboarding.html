<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Upster</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f2;
        --fg: #1f1f1e;
        --muted: #6b6b68;
        --accent: #2f6fed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --fg: #ececea;
          --muted: #9a9a96;
          --accent: #6ea0ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        align-self: flex-start;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #error {
        color: #c2483d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Set up Upster</h1>
      <p>
        Upster runs as a background service on this computer, so your pills and
        remote access keep working even when this window is closed.
      </p>
      <button id="install" type="button">Install Upster service</button>
      <p id="error" role="alert" hidden></p>
    </main>
    <script>
      const button = document.getElementById("install")
      const error = document.getElementById("error")
      const initial = new URLSearchParams(location.search).get("error")
      if (initial) {
        error.textContent = initial
        error.hidden = false
      }
      button.addEventListener("click", async () => {
        button.disabled = true
        button.textContent = "Installing..."
        error.hidden = true
        try {
          await window.upsterDesktop.installService()
        } catch (cause) {
          error.textContent = cause instanceof Error ? cause.message : String(cause)
          error.hidden = false
          button.disabled = false
          button.textContent = "Install Upster service"
        }
      })
    </script>
  </body>
</html>
