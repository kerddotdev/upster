<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>Upster</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: light-dark(
          oklch(98.8% 0.003 84.6),
          oklch(23.3% 0.011 254.1)
        );
        --foreground: light-dark(
          oklch(23.2% 0.006 78.2),
          oklch(93.2% 0.007 80.7)
        );
        --muted: light-dark(oklch(50.9% 0.014 79.7), oklch(71.4% 0.012 256.7));
        --brand-fill: light-dark(
          oklch(51.4% 0.222 16.9),
          oklch(64.5% 0.2 16.4)
        );
        --on-brand: light-dark(oklch(98% 0.01 12), oklch(17% 0.03 15));
        --danger: light-dark(oklch(49.9% 0.172 29.1), oklch(74% 0.126 27.6));
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--foreground);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
      }
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 46px;
        -webkit-app-region: drag;
      }
      main {
        max-width: 400px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 12px;
        height: 32px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: var(--brand-fill);
        color: var(--on-brand);
        font: inherit;
        font-weight: 500;
        cursor: default;
        transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: 3px solid
          color-mix(in oklch, var(--brand-fill) 50%, transparent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
      }
      section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button.secondary {
        background: transparent;
        color: var(--foreground);
        box-shadow: inset 0 0 0 1px var(--muted);
      }
      #migrate:not([hidden]) ~ #install {
        background: transparent;
        color: var(--foreground);
        box-shadow: inset 0 0 0 1px var(--muted);
      }
      button.link {
        height: auto;
        margin-top: 24px;
        padding: 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
      #error {
        color: var(--danger);
        user-select: text;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
            <stop stop-color="#d91d4e" />
            <stop offset="1" stop-color="#a91138" />
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" rx="230" fill="url(#bg)" />
        <path
          fill="#ffe8ee"
          fill-rule="evenodd"
          d="M222 832V478C222 302 340 192 512 192C684 192 802 302 802 478V832ZM384 832L450 562H350L512 370L674 562H574L640 832Z"
        />
      </svg>
      <h1 id="title">Set up Upster</h1>
      <p id="lead">
        Upster runs as a background service on this computer, so your pills and
        remote access keep working even when this window is closed.
      </p>
      <section id="docker" hidden>
        <p id="dockerSummary"></p>
        <p id="dockerNote" hidden></p>
        <button id="pickWorkspace" class="secondary" type="button" hidden>
          Choose workspace folder
        </button>
      </section>
      <div class="actions">
        <button id="migrate" type="button" hidden>Migrate from Docker</button>
        <button id="install" type="button">Install Upster service</button>
      </div>
      <p id="progress" role="status" hidden></p>
      <p id="error" role="alert" hidden></p>
      <button id="reset" class="link" type="button">Reset setup...</button>
    </main>
    <script>
      const bridge = window.upsterDesktop
      const $ = (id) => document.getElementById(id)
      const installButton = $("install")
      const migrateButton = $("migrate")
      const pickButton = $("pickWorkspace")
      const error = $("error")
      const progress = $("progress")
      let instance = null
      let workspaceRoot = null

      function showError(cause) {
        error.textContent =
          cause instanceof Error ? cause.message : String(cause)
        error.hidden = false
      }

      function setBusy(busy) {
        for (const button of [installButton, migrateButton, pickButton, $("reset")]) {
          button.disabled = busy
        }
      }

      function refreshMigrate() {
        migrateButton.disabled = !workspaceRoot
      }

      const initial = new URLSearchParams(location.search).get("error")
      if (initial) {
        error.textContent = initial
        error.hidden = false
      }

      async function detect() {
        try {
          const detection = await bridge.detectDockerInstance()
          instance = detection.instances[0] ?? null
          if (!instance) {
            return
          }
          workspaceRoot = instance.workspaceRoot
          $("title").textContent = "Set up Upster"
          $("docker").hidden = false
          $("dockerSummary").textContent =
            "Found your Docker install (" +
            instance.project +
            "). You can bring its pills, logs, vault and settings over."
          const notes = []
          if (instance.running) {
            notes.push("The Docker containers will be stopped first. Nothing is deleted.")
          }
          if (detection.nativeHasData) {
            notes.push("Existing data on this computer is backed up first.")
          }
          if (workspaceRoot) {
            notes.push("Workspace folder: " + workspaceRoot)
          }
          $("dockerNote").textContent = notes.join(" ")
          $("dockerNote").hidden = notes.length === 0
          pickButton.hidden = Boolean(workspaceRoot)
          migrateButton.hidden = false
          installButton.textContent = "Start fresh"
          refreshMigrate()
        } catch {
          // Docker detection is optional
        }
      }

      pickButton.addEventListener("click", async () => {
        const picked = await bridge.pickFolder()
        if (picked) {
          workspaceRoot = picked
          $("dockerNote").textContent = "Workspace folder: " + picked
          $("dockerNote").hidden = false
          refreshMigrate()
        }
      })

      migrateButton.addEventListener("click", async () => {
        setBusy(true)
        error.hidden = true
        progress.hidden = false
        progress.textContent = "Starting..."
        const stop = bridge.onMigrationEvent((event) => {
          if (event.type === "step") {
            progress.textContent = event.label + "..."
          }
        })
        try {
          await bridge.migrateFromDocker({
            project: instance.project,
            workspaceRoot,
            stopContainers: true,
          })
        } catch (cause) {
          showError(cause)
          progress.hidden = true
          setBusy(false)
          refreshMigrate()
        } finally {
          stop()
        }
      })

      installButton.addEventListener("click", async () => {
        setBusy(true)
        installButton.textContent = "Installing..."
        error.hidden = true
        try {
          await bridge.installService()
        } catch (cause) {
          showError(cause)
          installButton.textContent = instance ? "Start fresh" : "Install Upster service"
          setBusy(false)
          refreshMigrate()
        }
      })

      $("reset").addEventListener("click", async () => {
        try {
          await bridge.resetSetup()
        } catch (cause) {
          showError(cause)
        }
      })

      detect()
    </script>
  </body>
</html>
