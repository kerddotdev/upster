<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>Upster</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: light-dark(
          oklch(98.8% 0.003 84.6),
          oklch(23.3% 0.011 254.1)
        );
        --foreground: light-dark(
          oklch(23.2% 0.006 78.2),
          oklch(93.2% 0.007 80.7)
        );
        --muted: light-dark(oklch(50.9% 0.014 79.7), oklch(71.4% 0.012 256.7));
        --brand-fill: light-dark(
          oklch(51.4% 0.222 16.9),
          oklch(64.5% 0.2 16.4)
        );
        --on-brand: light-dark(oklch(98% 0.01 12), oklch(17% 0.03 15));
        --danger: light-dark(oklch(49.9% 0.172 29.1), oklch(74% 0.126 27.6));
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--surface);
        color: var(--foreground);
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
      }
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 46px;
        -webkit-app-region: drag;
      }
      main {
        max-width: 400px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      svg {
        width: 56px;
        height: 56px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 12px;
        height: 32px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: var(--brand-fill);
        color: var(--on-brand);
        font: inherit;
        font-weight: 500;
        cursor: default;
        transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: 3px solid
          color-mix(in oklch, var(--brand-fill) 50%, transparent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
      }
      #error {
        color: var(--danger);
        user-select: text;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <main>
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <rect width="1024" height="1024" rx="230" fill="#f6d6df" />
        <path
          fill="#c8143f"
          fill-rule="evenodd"
          d="M222 832V478C222 302 340 192 512 192C684 192 802 302 802 478V832ZM384 832L450 562H350L512 370L674 562H574L640 832Z"
        />
      </svg>
      <h1>Set up Upster</h1>
      <p>
        Upster runs as a background service on this computer, so your pills and
        remote access keep working even when this window is closed.
      </p>
      <button id="install" type="button">Install Upster service</button>
      <p id="error" role="alert" hidden></p>
    </main>
    <script>
      const button = document.getElementById("install")
      const error = document.getElementById("error")
      const initial = new URLSearchParams(location.search).get("error")
      if (initial) {
        error.textContent = initial
        error.hidden = false
      }
      button.addEventListener("click", async () => {
        button.disabled = true
        button.textContent = "Installing..."
        error.hidden = true
        try {
          await window.upsterDesktop.installService()
        } catch (cause) {
          error.textContent =
            cause instanceof Error ? cause.message : String(cause)
          error.hidden = false
          button.disabled = false
          button.textContent = "Install Upster service"
        }
      })
    </script>
  </body>
</html>
