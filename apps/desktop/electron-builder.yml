appId: com.kerddotdev.upster
productName: Upster
copyright: kerddotdev
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: stage/server-bundle
    to: server-bundle
  - from: stage/upster
    to: upster
mac:
  icon: build/Upster.icon
  minimumSystemVersion: "15.0"
  electronLanguages: [en]
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  title: Upster
linux:
  icon: build/icons
  desktop:
    entry:
      Name: Upster
      StartupWMClass: upster
  executableName: upster
  artifactName: Upster-${version}-${arch}.${ext}
  category: Development
  target: [AppImage, deb]
  maintainer: kerddotdev
  synopsis: Publish short-lived mini apps through Cloudflare Tunnel
deb:
  packageName: upster
publish:
  provider: github
  releaseType: release
  owner: kerddotdev
  repo: upster
