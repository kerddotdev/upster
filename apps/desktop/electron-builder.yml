appId: com.kerdofficial.upster
productName: Upster
copyright: kerdofficial
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: stage/server-bundle
    to: server-bundle
  - from: stage/upster
    to: upster
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
linux:
  executableName: upster
  category: Development
  target: [AppImage, deb]
  maintainer: kerdofficial
  synopsis: Publish short-lived mini apps through Cloudflare Tunnel
publish:
  provider: github
  owner: kerdofficial
  repo: upster
