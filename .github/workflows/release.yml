name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          gh workflow list --repo kerddotdev/homebrew-tap | grep -q "Update Upster Formula" \
            || { echo "TAP_GITHUB_TOKEN cannot see the tap workflow" >&2; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            version="${GITHUB_REF_NAME#v}"
            package_version=$(node -p "require('./package.json').version")
            if [ "$version" != "$package_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version="0.0.0-dryrun"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to modify an already published release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bun run scripts/check-release.ts prepare "$VERSION"

  server-bundles:
    # GitHub-hosted: Vectis job admission occasionally stalls and a stalled
    # job would block the whole release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64 }
          - { platform: darwin, arch: x64 }
          - { platform: linux, arch: arm64 }
          - { platform: linux, arch: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Package the headless server bundle
        env:
          UPSTER_VERSION: ${{ needs.meta.outputs.version }}
          UPSTER_TARGET_PLATFORM: ${{ matrix.platform }}
          UPSTER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run package:server
          tar -czf "upster-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" \
            -C dist/server-bundle "${{ matrix.platform }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle-${{ matrix.platform }}-${{ matrix.arch }}
          path: upster-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          retention-days: 1

  macos-binaries:
    runs-on: macos-latest
    needs: meta
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Build and sign macOS binaries
        working-directory: apps/cli
        env:
          UPSTER_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          UPSTER_CLI_TARGET=bun-darwin-arm64 UPSTER_CLI_OUTFILE=dist/upster-darwin-arm64 bun run build.ts
          UPSTER_CLI_TARGET=bun-darwin-x64 UPSTER_CLI_OUTFILE=dist/upster-darwin-x64 bun run build.ts
          # Cross-compiled bun binaries carry only a placeholder linker signature
          # that macOS rejects (SIGKILL on Apple Silicon). Re-sign ad-hoc natively.
          codesign --force --sign - --timestamp=none dist/upster-darwin-arm64
          codesign --force --sign - --timestamp=none dist/upster-darwin-x64
          codesign --verify --verbose dist/upster-darwin-arm64
          codesign --verify --verbose dist/upster-darwin-x64
          mkdir -p staging
          cp dist/upster-darwin-arm64 staging/upster
          tar -czf dist/upster-macos-arm64.tar.gz -C staging upster
          cp dist/upster-darwin-x64 staging/upster
          tar -czf dist/upster-macos-x64.tar.gz -C staging upster

      - uses: actions/upload-artifact@v4
        with:
          name: macos-tarballs
          path: |
            apps/cli/dist/upster-macos-arm64.tar.gz
            apps/cli/dist/upster-macos-x64.tar.gz
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [meta, macos-binaries, server-bundles]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Refuse to modify an already published release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: bun run scripts/check-release.ts prepare "$VERSION"

      - run: bun install --frozen-lockfile

      - run: bun run test

      - name: Build Linux binaries
        working-directory: apps/cli
        env:
          UPSTER_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          UPSTER_CLI_TARGET=bun-linux-arm64 UPSTER_CLI_OUTFILE=dist/upster-linux-arm64 bun run build.ts
          UPSTER_CLI_TARGET=bun-linux-x64 UPSTER_CLI_OUTFILE=dist/upster-linux-x64 bun run build.ts

      - name: Download signed macOS tarballs
        uses: actions/download-artifact@v4
        with:
          name: macos-tarballs
          path: apps/cli/dist

      - name: Download headless server bundles
        uses: actions/download-artifact@v4
        with:
          pattern: server-bundle-*
          merge-multiple: true
          path: apps/cli/dist

      - name: Package Linux tarballs and checksums
        working-directory: apps/cli
        run: |
          mkdir -p staging
          cp dist/upster-linux-arm64 staging/upster
          tar -czf dist/upster-linux-arm64.tar.gz -C staging upster
          cp dist/upster-linux-x64 staging/upster
          tar -czf dist/upster-linux-x64.tar.gz -C staging upster
          cd dist
          sha256sum \
            upster-macos-arm64.tar.gz \
            upster-macos-x64.tar.gz \
            upster-linux-arm64.tar.gz \
            upster-linux-x64.tar.gz \
            upster-server-*.tar.gz \
            > checksums.sha256

      - name: Prepare Docker consumer assets
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p release-assets
          sed "s|image: ghcr.io/kerddotdev/upster:.*|image: ghcr.io/kerddotdev/upster:$VERSION|" \
            docker-compose.release.yaml > release-assets/docker-compose.yaml
          cp .env.example release-assets/env.example

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: |
            ghcr.io/kerddotdev/upster:${{ needs.meta.outputs.version }}
            ghcr.io/kerddotdev/upster:latest

      - name: Keep dry-run artifacts
        if: needs.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-release-assets
          path: |
            apps/cli/dist/*.tar.gz
            apps/cli/dist/checksums.sha256
            release-assets/*
          retention-days: 3

      - name: Create draft GitHub Release
        if: needs.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apps/cli/dist/upster-macos-arm64.tar.gz
            apps/cli/dist/upster-macos-x64.tar.gz
            apps/cli/dist/upster-linux-arm64.tar.gz
            apps/cli/dist/upster-linux-x64.tar.gz
            apps/cli/dist/upster-server-*.tar.gz
            apps/cli/dist/checksums.sha256
            release-assets/docker-compose.yaml
            release-assets/env.example

  desktop:
    needs: [meta, release]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      publish: ${{ needs.meta.outputs.publish == 'true' }}
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    needs: [meta, release, desktop]
    if: needs.meta.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Verify every required asset and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bun run scripts/check-release.ts publish "$VERSION"
          gh release edit "v$VERSION" --draft=false

  homebrew:
    runs-on: ubuntu-latest
    needs: [meta, publish]
    if: needs.meta.outputs.publish == 'true'
    steps:
      - name: Download published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern checksums.sha256

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          MACOS_ARM64=$(awk '$2 == "upster-macos-arm64.tar.gz" { print $1 }' checksums.sha256)
          MACOS_X64=$(awk '$2 == "upster-macos-x64.tar.gz" { print $1 }' checksums.sha256)
          LINUX_ARM64=$(awk '$2 == "upster-linux-arm64.tar.gz" { print $1 }' checksums.sha256)
          LINUX_X64=$(awk '$2 == "upster-linux-x64.tar.gz" { print $1 }' checksums.sha256)
          for checksum in "$MACOS_ARM64" "$MACOS_X64" "$LINUX_ARM64" "$LINUX_X64"; do
            [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid release checksum" >&2; exit 1; }
          done
          gh workflow run update-upster-formula.yml \
            --repo kerddotdev/homebrew-tap \
            -f version="$VERSION" \
            -f sha256_macos_arm64="$MACOS_ARM64" \
            -f sha256_macos_x64="$MACOS_X64" \
            -f sha256_linux_arm64="$LINUX_ARM64" \
            -f sha256_linux_x64="$LINUX_X64"
