name: Desktop

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the v prefix
        type: string
        required: true
      publish:
        description: Upload the artifacts to the GitHub release
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the build
        type: string
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  macos:
    # The Vectis macOS image has no Xcode, so notarytool is unavailable there.
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26 for the app icon
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$xcode" || { echo "Xcode 26 or later is required to compile the .icon"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcrun actool --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Import signing certificate and notarization key
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf %s "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf %s "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize and publish
        env:
          UPSTER_VERSION: ${{ inputs.version }}
          UPSTER_TARGET_ARCH: ${{ matrix.arch }}
          CSC_NAME: Developer ID Application
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -n 65536
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          if [ "${{ inputs.publish }}" = "true" ]; then
            bun run package:desktop --publish
          else
            bun run package:desktop
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          retention-days: 7

  linux:
    runs-on: vectis-ubuntu
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build and publish
        env:
          UPSTER_VERSION: ${{ inputs.version }}
          UPSTER_TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            bun run package:desktop --publish
          else
            bun run package:desktop
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          retention-days: 7
