name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - name: CLI compile smoke build
        working-directory: apps/cli
        run: bun build src/index.ts --compile --outfile /tmp/upster-smoke

  desktop-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Built desktop smoke test
        run: xvfb-run --auto-servernum bun run --cwd apps/desktop test:smoke

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
