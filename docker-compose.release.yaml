services:
  upster:
    image: ghcr.io/kerdofficial/upster:${UPSTER_VERSION:-latest}
    environment:
      UPSTER_PORT: "${UPSTER_PORT:-3377}"
      UPSTER_BIND_HOST: "${UPSTER_BIND_HOST:-127.0.0.1}"
      UPSTER_DATA_DIR: "${UPSTER_DATA_DIR:-/data}"
      UPSTER_HOST_WORKSPACE: "${UPSTER_HOST_WORKSPACE:-}"
      UPSTER_WORKSPACE_ROOTS: "${UPSTER_WORKSPACE_ROOTS:-/workspaces}"
      UPSTER_ALLOWED_COMMANDS: "${UPSTER_ALLOWED_COMMANDS:-}"
      UPSTER_TAILSCALE_SOCKET: "/var/run/tailscale/tailscaled.sock"
      UPSTER_TAILSCALE_TARGET: "http://upster-app:${UPSTER_PORT:-3377}"
      UPSTER_SESSION_SECRET: "${UPSTER_SESSION_SECRET:-}"
      UPSTER_SECURE_COOKIES: "${UPSTER_SECURE_COOKIES:-}"
      DATABASE_URL: "${DATABASE_URL:-http://db:8080}"
      DATABASE_AUTH_TOKEN: "${DATABASE_AUTH_TOKEN:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${UPSTER_BIND_HOST:-127.0.0.1}:${UPSTER_PORT:-3377}:${UPSTER_PORT:-3377}"
    volumes:
      - upster_data:/data
      - tailscale_sock:/var/run/tailscale
      - ${UPSTER_HOST_WORKSPACE:-./workspaces}:/workspaces:rw
    networks:
      default:
        aliases:
          - upster-app
    depends_on:
      - db
      - tailscale

  tailscale:
    image: tailscale/tailscale:latest
    hostname: "${UPSTER_TAILSCALE_HOSTNAME:-upster}"
    entrypoint: ["/usr/local/bin/tailscaled"]
    command:
      - "--tun=userspace-networking"
      - "--statedir=/var/lib/tailscale"
      - "--socket=/var/run/tailscale/tailscaled.sock"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - tailscale_sock:/var/run/tailscale

  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      SQLD_NODE: primary
      SQLD_AUTH_JWT_KEY: "${SQLD_AUTH_JWT_KEY:-}"
    volumes:
      - upster_db:/var/lib/sqld

volumes:
  upster_data:
  upster_db:
  tailscale_state:
  tailscale_sock:
